version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: epson_exporter
    main: ./cmd/epson_exporter
    binary: epson_exporter
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/prometheus/common/version.Version={{ .Version }} -X github.com/prometheus/common/version.Revision={{ .Commit }} -X github.com/prometheus/common/version.Branch={{ .Branch }} -X github.com/prometheus/common/version.BuildDate={{ .Date }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  draft: false
